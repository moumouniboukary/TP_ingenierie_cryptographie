# /etc/nginx/conf.d/www.tp.local.conf  (TP 3, etape 2)
server {
    listen 443 ssl;
    server_name www.tp.local;

    # Chaine presentee : feuille + intermediaire (jamais la racine).
    ssl_certificate     /etc/nginx/tls/serveur_chaine.crt;
    ssl_certificate_key /etc/nginx/tls/serveur.key;

    # TLS 1.2 et 1.3 uniquement (TLS 1.0/1.1 sont obsoletes).
    ssl_protocols TLSv1.2 TLSv1.3;
    # Suites TLS 1.2 limitees a ECDHE + AEAD (le scan nmap avait montre des suites CBC
    # par defaut). Les suites TLS 1.3 sont toutes AEAD et ne sont pas concernees.
    ssl_ciphers 'ECDHE+AESGCM:ECDHE+CHACHA20';
    ssl_prefer_server_ciphers off;
    # Pas de tickets de session : leurs cles ne sont pas renouvelees automatiquement,
    # leur fuite permettrait de dechiffrer les sessions passees.
    ssl_session_tickets off;

    # Authentification mutuelle des clients
    ssl_client_certificate /etc/nginx/tls/racine.crt;   # ancre de confiance
    ssl_verify_client      on;                          # certificat client obligatoire
    ssl_verify_depth       2;                           # client -> intermediaire -> racine
    ssl_crl                /etc/nginx/tls/crls.pem;     # CRL de l'intermediaire ET de la racine

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        return 200 "Bonjour $ssl_client_s_dn\n";
    }
}
